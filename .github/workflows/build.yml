name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ['estudio/**', '.github/workflows/estudio.yml', 'PENDIENTE.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk VoleyCam.apk

      - name: Publicar registro de errores si falla
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Registro de la última compilación fallida
          prerelease: true
          files: build.log

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VoleyCam
          path: VoleyCam.apk

      - name: Publicar en Releases (descarga directa desde el móvil)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VoleyCam (última versión)
          body: "APK compilado automáticamente desde ${{ github.sha }}"
          files: VoleyCam.apk
          make_latest: true
