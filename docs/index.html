<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>VoleyCam · Mando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Pabellón: pista clara, tinta marino, azul y amarillo de balón */
  --bg:#EDF1F5; --panel:#FFFFFF; --panel2:#F3F6F9; --line:#D6DEE8;
  --text:#13233F; --muted:#5E6E85; --accent:#1D5FB4; --accent-s:#E3ECF8;
  --sun:#FFC629; --sun-s:#FFF4D1; --danger:#D62839; --ok:#1E9E5A; --warn:#B26B00;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 Barlow,system-ui,sans-serif;height:100%}
body{display:flex;flex-direction:column;min-height:100%;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button{font:600 15px Barlow,sans-serif;color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.sun{background:var(--sun);border-color:var(--sun);color:var(--text)}
button.danger{color:var(--danger);border-color:#f0c2c8;background:var(--panel)}
button.ghost{background:transparent}
button.on{background:var(--accent-s);border-color:var(--accent);color:var(--accent)}
button.flash{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
input,select,textarea{font:500 16px Barlow,sans-serif;color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input[type=color]{padding:2px;height:44px}
label{display:block;color:var(--muted);font:600 14px Barlow,sans-serif;margin:10px 2px 5px}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font:800 24px 'Barlow Condensed',sans-serif;margin:0;flex:1}
header h1 span{color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--danger)}
.dot.ok{background:var(--ok)}
.chip{font:600 13px Barlow;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.hbtn{padding:6px 9px;font-size:16px;line-height:1}
main{padding:12px;flex:1;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:7px}
.sec>h2{margin:0 2px;font:700 19px 'Barlow Condensed',sans-serif;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec>h2 small{font:500 14px Barlow;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card h2{margin:0 0 8px;font:700 18px 'Barlow Condensed',sans-serif}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 button{padding:10px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:4px}.seg button{padding:6px 10px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button{flex:1 1 30%}
.muted{color:var(--muted)}
.small{font-size:14px}
.hidden{display:none!important}
.link{background:none;border:0;padding:4px;color:var(--accent);font:600 15px Barlow}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;border-top:3px solid transparent;border-radius:0;padding:8px 2px 10px;color:var(--muted);font:600 12px Barlow}
nav button b{display:block;font-size:19px;font-weight:400;margin-bottom:1px}
nav button.act{color:var(--accent);border-top-color:var(--accent)}
body.native nav{position:sticky}

/* Marcador (Juego) */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpanel{position:relative;border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow:hidden;user-select:none;text-align:center}
.tpanel .bar{height:10px}
.tpanel .hit{display:flex;flex-direction:column;align-items:center;padding:10px 6px 2px;cursor:pointer}
.tpanel .hit:active{background:var(--panel2)}
.logo{width:52px;height:52px;background:center/contain no-repeat;flex:0 0 auto}
.tname{font:800 22px 'Barlow Condensed',sans-serif;letter-spacing:.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pts{font:800 112px/.92 'Barlow Condensed',sans-serif;letter-spacing:-.02em;margin:0 0 4px}
.serve{position:absolute;top:20px;right:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--panel);padding:0}
.serve.on{background:var(--sun);border-color:#e6ad00}
.tsets{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px 8px}
.tsets button{width:36px;height:34px;padding:0;font-size:19px}
.tsets b{font:800 30px 'Barlow Condensed',sans-serif;color:var(--accent);min-width:22px}
.tsets span{font:600 13px Barlow;color:var(--muted)}
.tfoot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px 9px}
.setline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font:700 17px 'Barlow Condensed',sans-serif;color:var(--muted)}
.pill.now{background:var(--text);border-color:var(--text);color:#fff}
.final{text-align:center;color:var(--accent);font:800 22px 'Barlow Condensed',sans-serif}
.clock{font:800 64px/1 'Barlow Condensed',sans-serif;text-align:center}
.tline{display:flex;align-items:center;gap:10px}
.tline .t{font:800 36px 'Barlow Condensed',sans-serif;flex:1}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;padding:0;border:0;flex:0 0 46px}
.sw:after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:left .15s}
.sw.on{background:var(--accent)}.sw.on:after{left:21px}
.optrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.optrow:first-child{border-top:0}
.optrow>span{flex:1}
.nowbar{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;background:var(--panel);border:1.5px solid var(--line)}
.nowbar.full{background:var(--sun-s);border-color:var(--sun)}
.nowbar b{flex:1;font:700 19px 'Barlow Condensed',sans-serif}
.nowbar .ld{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.nowbar.full .ld{background:var(--danger)}
.sptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sptile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;font:600 13px Barlow;border-radius:12px}
.sptile i{display:block;width:100%;height:48px;background:center/contain no-repeat}
.sptile.add{justify-content:center;color:var(--muted);border-style:dashed}
.posgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:86px;padding:3px;border:1.5px solid var(--line);border-radius:9px}
.posgrid button{height:22px;padding:0;border:0;border-radius:4px;background:var(--panel2)}
.posgrid button.on{background:var(--accent)}

/* Listas */
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .swc{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:5px}
.preview-logo{width:60px;height:60px;border-radius:12px;background:var(--panel2) center/contain no-repeat;border:1px dashed var(--line);flex:0 0 60px}
.restable{width:100%;border-collapse:collapse}
.restable th{font:600 13px Barlow;color:var(--muted);padding:4px}
.restable td{text-align:center;font:700 22px 'Barlow Condensed',sans-serif;padding:4px}
.restable td.n{text-align:left;font:800 20px 'Barlow Condensed',sans-serif}
.restable td.lo{color:#a7b3c3}
.restable td.win{background:var(--accent);color:#fff;border-radius:8px}
.restable td.tot{background:var(--panel2);border-radius:8px}
.ytuse{border:2px solid var(--accent);border-radius:12px;padding:9px 11px;background:var(--accent-s)}
.ytuse b{font:700 18px 'Barlow Condensed',sans-serif}
.gate{max-width:420px;margin:12vh auto;padding:0 20px;text-align:center}
.gate h1{font:800 44px 'Barlow Condensed',sans-serif;margin:0 0 6px}
.gate h1 span{color:var(--accent)}
code{background:var(--panel2);padding:2px 6px;border-radius:6px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:90vw;text-align:center}
.warnbar{background:#FDE7EA;color:#8a1020;font-size:14px;font-weight:600;padding:7px 14px;border-bottom:1px solid #f3c2c9}

/* Mini mando / compacto */
body.compact{padding-bottom:0}
body.compact nav{display:none}
body.compact header{padding:6px 10px}
body.compact header h1{font-size:19px}
body.compact main{padding:8px;gap:6px}
.crow{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding-right:6px;min-height:56px}
.cbar{width:7px;align-self:stretch}
.clogo{width:30px;height:30px;background:center/contain no-repeat;flex:0 0 30px}
.cname{flex:1;min-width:0;font:800 20px 'Barlow Condensed',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cserve{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--panel);padding:0;flex:0 0 20px}
.cserve.on{background:var(--sun);border-color:#e6ad00}
.csets{display:flex;align-items:center;gap:3px}
.csets button{padding:3px 8px}
.csets b{min-width:18px;text-align:center;color:var(--accent);font:800 21px 'Barlow Condensed',sans-serif}
.cpts{min-width:62px;padding:3px 8px;font:800 38px/1 'Barlow Condensed',sans-serif;background:var(--text);border-color:var(--text);color:#fff}
.cmin{padding:8px}
.cinfo{display:flex;justify-content:space-between;align-items:center;font:700 17px 'Barlow Condensed',sans-serif;color:var(--muted);padding:0 4px}
.cbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cbtns button{padding:8px 2px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cclock{font:800 22px 'Barlow Condensed',sans-serif;color:var(--text)}
.setrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.setrow input{width:64px;text-align:center;padding:8px}
.setrow span{min-width:44px;color:var(--muted);font-weight:600}

/* Remoto */
#remoteModal{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:12px 14px 24px}
#remoteModal .prev{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000 center/contain no-repeat;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:14px}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:12px 0;font-size:15px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.stgrid b{color:var(--text)}
.stgrid span{color:var(--muted)}
/* Compartir: QR a pantalla completa para enseñarlo en el pabellón */
#shareOv{position:fixed;inset:0;z-index:60;background:#fff;color:#13233F;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:16px 16px 24px;gap:10px}
#shareOv h2{margin:4px 0 0;padding:0 44px;font:800 26px/1.1 'Barlow Condensed',sans-serif;text-align:center}
#shareOv .qr{width:min(82vw,62vh,420px);aspect-ratio:1}
#shareOv .qr svg{width:100%;height:100%;display:block}
#shareOv .url{font-weight:700;word-break:break-all;text-align:center}
#shareOv .wa{display:flex;gap:6px;width:100%;max-width:420px}
#shareOv .wa input{min-width:0}
#shareOv .wa .pre{flex:0 0 64px}
#shareOv .wa .num{flex:1}
#shareOv .wa .primary{background:#1FA855;border-color:#1FA855}
#shareOv .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px}
#shareOv .close{position:absolute;top:8px;right:8px}
/* Cabezal de giro: botones de mantener pulsado */
.panrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.panrow button{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:20px;padding:14px 0}
.panrow button.hold{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="logic.js"></script>
<script src="presets.js"></script>
<script src="qrcode.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
'use strict';
/* ================= Arranque ================= */
const $app = document.getElementById('app');
const hash = new URLSearchParams(location.hash.slice(1));
const IS_NATIVE = hash.get('native') === '1' && !!window.SportCamNative;
if (IS_NATIVE) document.body.classList.add('native');

function getKey() {
  const k = hash.get('k');
  if (k) { try { localStorage.setItem('sc_key', k); } catch (e) {} return k; }
  try { return localStorage.getItem('sc_key') || ''; } catch (e) { return ''; }
}
let KEY = getKey();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg = window.SPORTCAM_FIREBASE || {};

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}

if (!cfg.databaseURL) {
  $app.innerHTML = `<div class="gate"><h1>Voley<span>Cam</span></h1>
    <p class="muted">Falta configurar Firebase en <code>docs/config.js</code>. Sigue los pasos del README.</p></div>`;
} else if (!KEY || KEY.length < 16) {
  $app.innerHTML = `<div class="gate"><h1>Voley<span>Cam</span></h1>
    <p class="muted">Escanea el código QR que aparece en Ajustes de la app, o pega aquí la clave del canal.</p>
    <input id="kin" placeholder="Clave del canal" autocomplete="off">
    <p><button class="primary" id="kok" style="width:100%">Entrar</button></p></div>`;
  document.getElementById('kok').onclick = () => {
    const v = document.getElementById('kin').value.trim();
    if (v.length < 16) return toast('Clave no válida');
    try { localStorage.setItem('sc_key', v); } catch (e) {}
    location.hash = 'k=' + encodeURIComponent(v); location.reload();
  };
} else {
  start();
}

/* ================= App ================= */
function start() {
  firebase.initializeApp(cfg);
  const db = firebase.database();
  const base = db.ref('c/' + KEY);
  const liveRef = base.child('live');
  const teamsRef = base.child('teams');
  const sponsRef = base.child('sponsors');
  const matchesRef = base.child('matches');
  const marksRef = base.child('marks');
  const statusRef = base.child('status');
  const cmdRef = base.child('cmd');
  const previewRef = base.child('preview');
  const remoteRef = base.child('remote');
  const coverRef = base.child('cover');
  const shareRef = base.child('share');
  const playersRef = base.child('players'); // jugadoras del club (con foto o cromo opcional)
  const squadRef = base.child('squad');     // convocatoria del partido: { ids:{id:true}, num:{id:n}, team, tag }   // enlace del canal de YouTube y mensaje del chat

  let live = SC.defaultLive();
  let teams = {};
  let sponsors = {};
  let matches = {};
  let marks = {};
  let status = null;          // estado que publica el móvil cámara
  let cover = '';             // imagen de portada (miniatura YouTube y prepartido)
  let share = {};             // { channel, chatOff, chatMsg }
  let shareOpen = false;
  let players = {};
  let squad = {};
  let editingPl = null;   // id de jugadora en edición o 'new'
  let ytShowOld = false;
  let markFlashUntil = 0;
  let remoteOpen = false, remoteTimer = null;
  let ytState = { connected: false, broadcasts: [], message: '' };
  let offset = 0;
  let connected = false;
  let loaded = false;
  let tab = (() => { try { const t = localStorage.getItem('sc_tab'); return ['juego','pantalla','partido','despues','ajustes'].includes(t) ? t : 'juego'; } catch (e) { return 'juego'; } })();
  let showSets = false, timerOpen = false, spFormOpen = false, editingMark = null, lastMark = null;
  const spDraft = { logo: '', full: '' };
  let compact = IS_NATIVE ? hash.get('mini') === '1' : (() => { try { return localStorage.getItem('sc_compact') === '1'; } catch (e) { return false; } })();
  const undo = [];
  let editing = null;   // id de equipo en edición o 'new'
  let editingSp = null; // id de patrocinador en edición
  let draftLogo = null; // logo pendiente en el formulario de equipo

  const now = () => Date.now() + offset;

  db.ref('.info/connected').on('value', s => { connected = !!s.val(); renderHeader(); });
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; pushNative(); });
  liveRef.on('value', s => {
    loaded = true;
    if (s.val() == null) { liveRef.set(SC.defaultLive()); return; }
    live = SC.normalize(s.val()); render(); pushNative();
  });
  teamsRef.on('value', s => { teams = s.val() || {}; render(); pushNative(); pushSquad(); });
  sponsRef.on('value', s => { sponsors = s.val() || {}; render(); pushNative(); });
  matchesRef.on('value', s => { matches = s.val() || {}; if (tab !== 'juego') render(); });
  coverRef.on('value', s => {
    cover = s.val() || '';
    if (IS_NATIVE) { try { window.SportCamNative.setCover(cover); } catch (e) {} }
    if (tab !== 'juego' && !compact) render();
  });
  statusRef.on('value', s => { const was = replaying(); const pk = JSON.stringify((panInfo() || {}).state) + ((panInfo() || {}).on ? 1 : 0); status = s.val(); const pk2 = JSON.stringify((panInfo() || {}).state) + ((panInfo() || {}).on ? 1 : 0); if (pk !== pk2 && !panTimer && (tab === 'juego' || tab === 'ajustes') && !compact) render(); if (was !== replaying() && (tab === 'juego' || compact)) render(); if (!IS_NATIVE) { renderWarn(); if (remoteOpen) renderRemote(); } if (shareOpen) renderShare(); });
  if (IS_NATIVE) {
    // Órdenes del mando remoto hacia la cámara
    let lastCmd = ''; try { lastCmd = localStorage.getItem('sc_lastcmd') || ''; } catch (e) {}
    cmdRef.on('value', s => {
      const c = s.val(); if (!c || !c.id || c.id === lastCmd) return;
      lastCmd = c.id; try { localStorage.setItem('sc_lastcmd', c.id); } catch (e) {}
      if (now() - (c.ts || 0) > 30000) return;
      try { window.SportCamNative.command(c.action); } catch (e) {}
    });
    remoteRef.on('value', s => { try { window.SportCamNative.onRemote(s.val() || 0); } catch (e) {} });
  }
  marksRef.on('value', s => { marks = s.val() || {}; if (tab !== 'juego' && !compact) render(); pushNative(); });
  playersRef.on('value', s => { players = s.val() || {}; if ((tab === 'ajustes' || tab === 'partido') && !compact) render(); pushSquad(); });
  squadRef.on('value', s => { squad = s.val() || {}; if (tab === 'partido' && !compact) render(); pushSquad(); });
  shareRef.on('value', s => { share = s.val() || {}; if (tab !== 'juego' && !compact) render(); pushNative(); if (shareOpen) renderShare(); });

  /* ---------- Acciones ---------- */
  function act(fn) {
    undo.push(JSON.stringify(live)); if (undo.length > 60) undo.shift();
    liveRef.transaction(cur => fn(SC.normalize(cur), now()));
    if (navigator.vibrate) navigator.vibrate(15);
  }
  function setField(path, val) { liveRef.child(path).set(val); }
  function doUndo() {
    const prev = undo.pop();
    if (!prev) return toast('Nada que deshacer');
    liveRef.set(JSON.parse(prev));
  }

  /* ---------- Puente con la app Android ---------- */
  let nativeTimer = null;
  function teamView(id, fallback) {
    const t = teams[id] || {};
    return { name: t.name || fallback, short: t.short || fallback,
             color: t.color || (fallback === 'LOCAL' ? '#1e6bff' : '#ff3b3b'), logo: t.logo || '' };
  }
  function pushNative() {
    if (!IS_NATIVE || !loaded) return;
    clearTimeout(nativeTimer);
    nativeTimer = setTimeout(() => {
      const model = Object.assign({}, live, {
        home: teamView(live.homeId, 'LOCAL'),
        away: teamView(live.awayId, 'VISITANTE'),
        sponsorList: Object.values(sponsors).filter(s => s.logo || s.full).map(s => ({ logo: s.logo || '', text: s.text || '', full: s.full || '' })),
        spFullItem: (live.spFull.show && sponsors[live.spFull.id]) ? { logo: sponsors[live.spFull.id].logo || '', text: sponsors[live.spFull.id].text || '', full: sponsors[live.spFull.id].full || '' } : null,
        savedMatches: savedMatchesForNative(),

  function markLabel(L, prefix) {
    const sc = `${L.score.h}-${L.score.a}`;

  /* Tipos de jugada. Una jugada puede tener varias etiquetas: se guardan en kind separadas por "+". */
  const TAG_ORDER = ['jugada', 'carmen', 'bloqueo', 'recepcion'];
  const TAG_ICON = { jugada: '⭐', carmen: '💜', bloqueo: '🧱', recepcion: '🛡' };
  const TAG_ACT = { jugada: 'mark', carmen: 'markc', bloqueo: 'markb', recepcion: 'markr' };
  const tagName = t => t === 'carmen' ? hlName() : { jugada: 'Jugada', bloqueo: 'Bloqueo', recepcion: 'Recepción' }[t];
  const tagsOf = m => { const t = new Set(String((m && m.kind) || '').split('+').filter(Boolean)); if (!t.size) t.add('jugada'); return t; };
  const kindOf = set => (set.size === 1 && set.has('jugada')) ? null : TAG_ORDER.filter(x => set.has(x)).join('+');
  const iconsOf = m => { const t = tagsOf(m); return TAG_ORDER.filter(x => t.has(x)).map(x => TAG_ICON[x]).join(''); };
  /** Marca una jugada. Si se pulsó otro botón hace menos de 5 s, se añade la etiqueta a esa misma jugada. */

    type = type || 'jugada';

    if (prev) {

  function fileToLogo(file, max = 160, jpeg = false) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onerror = rej;
      fr.onload = () => {
        const img = new Image();
        img.onerror = rej;
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          let url = jpeg ? c.toDataURL('image/jpeg', 0.85) : c.toDataURL('image/webp', 0.9);
          if (!jpeg && !url.startsWith('data:image/webp')) url = c.toDataURL('image/png');
          res(url);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function panCard() {
    const p = panInfo();
    if (!p || !p.on) return '';
    const st = { connected: '✓ conectado', searching: 'buscando el cabezal…', nobt: 'activa el Bluetooth del móvil cámara', off: 'apagado' }[p.state] || p.state;
    const ok = p.state === 'connected';
    return sec('Cámara motorizada', `<div class="card">
      <div class="panrow"><button data-pan="l" ${ok ? '' : 'disabled'}>◀</button>
        <button data-act="panC" ${ok ? '' : 'disabled'}>Centrar</button>
        <button data-pan="r" ${ok ? '' : 'disabled'}>▶</button></div>
      <div class="optrow" style="border-top:0;margin-top:6px"><span>Velocidad</span><div class="seg">
        ${[1, 2, 3, 4, 5].map(n => `<button class="${(p.speed || 3) === n ? 'on' : ''}" data-act="panSpeed" data-v="${n}">${n}</button>`).join('')}</div></div>
      <p class="muted small" style="margin:4px 0 0">Mantén pulsado ◀ o ▶ para girar.</p></div>`, st);
  }
  function openRemote() {
    remoteOpen = true;
    let m = document.getElementById('remoteModal');
    if (!m) { m = document.createElement('div'); m.id = 'remoteModal'; document.body.appendChild(m); }
    remoteRef.set(now());
    remoteTimer = setInterval(() => { remoteRef.set(now()); renderRemote(); }, 5000);
    previewRef.on('value', onPreview);
    renderRemote();
  }
  function closeRemote() {
    remoteOpen = false; clearInterval(remoteTimer); previewRef.off && previewRef.off('value', onPreview);
    const m = document.getElementById('remoteModal'); if (m) m.remove();
  }
  let lastPreview = null;
  function onPreview(s) { lastPreview = s.val(); const p = document.getElementById('prevImg'); if (p) paintPreview(p); }
  function paintPreview(p) {
    if (lastPreview && lastPreview.img) {
      p.style.backgroundImage = `url('${lastPreview.img}')`;
      p.textContent = '';
      const age = Math.round((now() - lastPreview.ts) / 1000);
      const a = document.getElementById('prevAge'); if (a) a.textContent = age < 60 ? `Imagen de hace ${age} s` : 'Imagen antigua';
    }
  }
  function fmtSecs(t) { t = Math.max(0, t | 0); const h = t / 3600 | 0, m = (t / 60 | 0) % 60, x = t % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); }
  function renderRemote() {
    const m = document.getElementById('remoteModal'); if (!m || !remoteOpen) return;
    const st = status || {}; const fresh = statusFresh();
    const estado = !fresh ? 'SIN CONEXIÓN CON LA CÁMARA' : st.wantLive ? (st.connected ? (st.weakNet ? '● EN DIRECTO (red débil)' : '● EN DIRECTO') : st.reconnecting ? 'RECONECTANDO…' : 'CONECTANDO…') : st.rec ? '● GRABANDO' : 'SIN EMITIR';
    m.innerHTML = `<div class="row" style="margin-bottom:10px"><h2 style="margin:0;font:800 22px 'Barlow Condensed',sans-serif">📡 Cámara a distancia</h2>
        <button style="flex:0 0 auto" data-r="close">✕</button></div>
      <div class="prev" id="prevImg">Esperando imagen de la cámara…</div>
      <p class="muted" id="prevAge" style="font-size:12px;margin:4px 0 0"></p>
      <div class="stgrid">
        <span>Estado</span><b style="color:${st.wantLive && st.connected ? 'var(--danger)' : 'var(--text)'}">${estado}</b>
        <span>Tiempo</span><b>${fresh && st.wantLive ? fmtSecs(st.liveSecs) : fresh && st.rec ? fmtSecs(st.recSecs) : '—'}</b>
        <span>Batería</span><b>${fresh && st.battery >= 0 ? st.battery + ' %' + (st.charging ? ' ⚡' : '') : '—'}</b>
        <span>Red</span><b>${fresh && st.connected ? (st.bitrateKbps / 1000).toFixed(1) + ' Mb/s' : '—'}</b>
        <span>Micro</span><b>${fresh ? (st.muted ? '🔇 Silenciado' : '🎙 Activo') : '—'}</b>
        <span>Grabación</span><b>${fresh ? (st.rec ? '● Grabando' : 'No') : '—'}</b>
      </div>
      <div class="btns">
        ${st.wantLive ? '<button class="danger" data-r="live_stop">⏹ Parar directo</button>' : '<button class="primary" data-r="live_start">▶ Iniciar directo</button>'}
        <button data-r="rec_toggle">${st.rec ? '⏹ Parar grabación' : '⏺ Grabar'}</button>
        <button data-r="mute_toggle">${st.muted ? '🎙 Activar micro' : '🔇 Silenciar'}</button>
        <button data-r="zoom_out">Zoom −</button><button data-r="zoom_in">Zoom +</button>
        <button data-r="switch">⟲ Cambiar cámara</button>
        <button data-r="${st.dim ? 'dim_off' : 'dim_on'}">${st.dim ? '☀ Encender pantalla' : '🌙 Ahorro de pantalla'}</button>
      </div>`;
    paintPreview(document.getElementById('prevImg'));
    m.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
      const a = b.dataset.r;
      if (a === 'close') return closeRemote();
      if (a === 'live_start' && !confirm('¿Iniciar el directo en la cámara?')) return;
      if (a === 'live_stop' && !confirm('¿Parar el directo?')) return;
      sendCmd(a);
    });
  }

  function setCompact(v) {
    compact = v;
    if (IS_NATIVE) { try { window.SportCamNative.setMini(v); } catch (e) {} }
    else { try { localStorage.setItem('sc_compact', v ? '1' : '0'); } catch (e) {} }
    render(); window.scrollTo(0, 0);
  }
  shell();

  function renderHeader() {
    document.body.classList.toggle('compact', compact);
    const b = document.getElementById('cmpBtn'); if (b) b.textContent = compact ? '⤢' : '⤡';
    const d = document.getElementById('dot'); if (d) d.className = 'dot' + (connected ? ' ok' : '');
    const c = document.getElementById('sportChip'); if (c) c.textContent = live.sport === 'football' ? 'Fútbol' : 'Voleibol';
  }

  function render() {
    renderHeader();
    $app.querySelectorAll('nav button').forEach(b => b.classList.toggle('act', b.dataset.tab === tab));
    const m = document.getElementById('main');
    if (!loaded) { m.innerHTML = '<p class="muted">Conectando…</p>'; return; }
    // No pisar lo que el usuario está escribiendo: se repinta al salir del campo
    const ae = document.activeElement;
    if (ae && m.contains(ae) && /INPUT|SELECT|TEXTAREA/.test(ae.tagName) && ae.type !== 'file' && ae.type !== 'checkbox') {
      ae.addEventListener('blur', () => setTimeout(render, 0), { once: true });
      return;
    }
    const views = { juego: viewScore, pantalla: viewGraphics, partido: viewPartido, despues: viewDespues, ajustes: viewAjustes };
    m.innerHTML = compact ? viewCompact() : (views[tab] || viewScore)();
    bind(m);
    tickClock();
  }

  const sec = (title, body, extra) => `<section class="sec"><h2>${title}${extra ? `<small>${extra}</small>` : ''}</h2>${body}</section>`;
  const sw = (on, act, attrs = '') => `<button class="sw ${on ? 'on' : ''}" data-act="${act}" ${attrs} aria-pressed="${on}"></button>`;
  const opt = (label, on, act, attrs) => `<div class="optrow"><span>${label}</span>${sw(on, act, attrs)}</div>`;
  const tmDots = side => '●'.repeat(live.to[side]) + '○'.repeat(2 - live.to[side]);
  const sideTeam = side => teamView(side === 'h' ? live.homeId : live.awayId, side === 'h' ? 'LOCAL' : 'VISITANTE');
  /** Pantalla completa puesta y sin caducar (tiempo muerto 30 s, fin de set 2 min). */
  const brkActive = () => live.brk.show && (!live.brk.until || now() < live.brk.until);
  const BRK_AUTO = { tm: 30000, set: 120000 };
  const fmtLeft = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const backLabel = scr => scr && scr.until ? `Volver al partido <span class="brkLeft">(${fmtLeft(scr.until - now())})</span>` : (scr ? 'Volver al partido' : 'Quitar');
  function showBreak(text, kind) {
    const until = BRK_AUTO[kind] ? now() + BRK_AUTO[kind] : 0;
    return liveRef.update({ brk: { show: true, text, kind, until }, 'spFull/show': false });
  }
  /** Qué pantalla completa se ve ahora en el vídeo (solo puede haber una). */
  function onScreen() {
    if (live.spFull.show && sponsors[live.spFull.id]) return { kind: 'sp', text: 'Patrocinador: ' + (sponsors[live.spFull.id].name || 'logo') };
    if (brkActive()) return { kind: 'brk', text: live.brk.text, until: live.brk.until || 0 };
    return null;
  }

  function teamPanel(side) {
    const t = sideTeam(side);
    const volley = live.sport === 'volley';
    return `<div class="tpanel">
      <div class="bar" style="background:${esc(t.color)}"></div>
      ${volley ? `<button class="serve ${live.serve === side ? 'on' : ''}" data-act="serve" data-s="${side}" title="Saque"></button>` : ''}
      <div class="hit" data-act="${volley ? 'point' : 'goal'}" data-s="${side}">
        <div class="logo" style="${t.logo ? `background-image:url('${t.logo}')` : ''}"></div>
        <div class="tname">${esc(t.short)}</div>
        <div class="pts">${live.score[side]}</div>
      </div>
      ${volley ? `<div class="tsets"><button data-act="setAdj" data-s="${side}" data-v="-1">−</button><span>SETS</span><b>${live.sets[side]}</b><button data-act="setAdj" data-s="${side}" data-v="1">+</button></div>` : ''}
      <div class="tfoot"><button class="ghost" data-act="minus" data-s="${side}">−1</button>
        ${volley ? `<button data-act="tmCycle" data-s="${side}" title="Tiempos muertos usados">TM ${tmDots(side)}</button>` : '<span></span>'}</div>
    </div>`;
  }

  function compactRow(side) {
    const t = sideTeam(side);
    const volley = live.sport === 'volley';
    const nm = (teams[side === 'h' ? live.homeId : live.awayId] || {}).name || '';
    const full = nm && nm.length <= 14 ? nm : t.short;
    return `<div class="crow">
      <div class="cbar" style="background:${esc(t.color)}"></div>
      <div class="clogo" style="${t.logo ? `background-image:url('${t.logo}')` : ''}"></div>
      <div class="cname">${esc(full)}</div>
      ${volley ? `<button class="cserve ${live.serve === side ? 'on' : ''}" data-act="serve" data-s="${side}" title="Saque"></button>
        <div class="csets"><button data-act="setAdj" data-s="${side}" data-v="-1">−</button><b>${live.sets[side]}</b><button data-act="setAdj" data-s="${side}" data-v="1">+</button></div>` : ''}
      <button class="cpts" data-act="${volley ? 'point' : 'goal'}" data-s="${side}">${live.score[side]}</button>
      <button class="cmin ghost" data-act="minus" data-s="${side}">−1</button>
    </div>`;
  }

  function viewCompact() {
    const volley = live.sport === 'volley';
    const showClock = !volley || live.timer.show;
    const scr = onScreen();
    const info = volley ? `${live.finished ? 'FINAL' : 'SET ' + live.setNo}${live.history.length ? ' · ' + live.history.map(x => x.h + '-' + x.a).join(' ') : ''}` : esc(live.clock.period);
    const quick = volley ? ['TIEMPO MUERTO', 'tm', 'T. muerto'] : ['DESCANSO', 'half', 'Descanso'];
    return `${compactRow('h')}${compactRow('a')}
      <div class="cinfo"><span>${info}${scr ? ` · <span style="color:var(--danger)">● ${esc(scr.text)}</span>` : ''}${live.muted ? ' · 🔇' : ''}</span>
        ${showClock ? `<span class="row" style="flex:0 0 auto;gap:6px"><span class="cclock" id="clk">00:00</span><button class="${live.clock.running ? '' : 'primary'}" style="padding:4px 10px" data-act="clk">${live.clock.running ? '❚❚' : '▶'}</button></span>` : ''}</div>
      <div class="cbtns">
        ${markBtns(true)}
        ${replayBtn()}
        <button data-act="undo">Deshacer</button>
        ${scr ? `<button class="sun" data-act="allHide">${scr.until ? `Volver <span class="brkLeft">(${fmtLeft(scr.until - now())})</span>` : 'Quitar'}</button>`
              : `<button data-act="brkq" data-v="${quick[0]}" data-k="${quick[1]}">${quick[2]}</button>`}
        <button class="primary" data-act="expand">Más ⤢</button>
      </div>`;
  }

  function timerCard(volley) {
    return `<div class="card">
      <div class="clock" id="clk">00:00</div>
      <p class="muted" style="text-align:center;margin:4px 0 10px">${volley ? '' : esc(live.clock.period) + ' · '}${live.clock.dir === 'down' ? 'cuenta atrás' : 'ascendente'}</p>
      <div class="btns">
        <button class="${live.clock.running ? '' : 'primary'}" data-act="clk">${live.clock.running ? 'Pausar' : 'Iniciar'}</button>
        <button data-act="clkadj" data-v="-60000">−1 min</button>
        <button data-act="clkadj" data-v="60000">+1 min</button>
        <button data-act="clkadj" data-v="-1000">−1 s</button>
        <button data-act="clkadj" data-v="1000">+1 s</button>
        <button class="ghost" data-act="clkreset">Reiniciar</button>
      </div>
      ${volley ? `<div class="grid2" style="margin-top:10px">
          <button class="${live.clock.dir === 'up' ? 'on' : ''}" data-act="dir" data-v="up">Ascendente</button>
          <button class="${live.clock.dir === 'down' ? 'on' : ''}" data-act="dir" data-v="down">Cuenta atrás</button></div>
        ${live.clock.dir === 'down' ? `<label>Minutos de la cuenta atrás</label><input type="number" id="durMin" value="${Math.round(live.clock.durMs / 60000)}">` : ''}`
      : `<label>Periodo</label>
        <div class="btns">${['1ª PARTE', '2ª PARTE', 'PRÓRROGA', 'PENALTIS'].map(p =>
          `<button class="${live.clock.period === p ? 'on' : ''}" data-act="period" data-v="${p}">${p}</button>`).join('')}</div>`}
    </div>`;
  }

  function setsCard() {
    const rows = live.history.map((x, i) => `<div class="setrow"><span>Set ${i + 1}</span>
      <input type="number" min="0" id="sh${i}" value="${x.h}"> – <input type="number" min="0" id="sa${i}" value="${x.a}">
      <button data-act="setEdit" data-i="${i}">Guardar</button><button class="danger" data-act="setDel" data-i="${i}">✕</button></div>`).join('');
    return `<div class="card"><h2>Corregir sets</h2>
      ${rows || '<p class="muted" style="margin:0">Aún no hay sets terminados.</p>'}
      <label>Añadir set terminado</label>
      <div class="setrow" style="margin-top:0"><span>Set ${live.history.length + 1}</span>

        <button data-act="setAdd">Añadir</button></div>
      <p class="muted small" style="margin-bottom:0">Los sets ganados se recalculan con estos resultados.</p></div>`;

  /* ----- Pestaña JUEGO ----- */
  function viewScore() {
    const volley = live.sport === 'volley';
    const scr = onScreen();
    let h = `<div class="teams">${teamPanel('h')}${teamPanel('a')}</div>`;
    if (volley) {
      h += `<div class="setline">${live.history.map((x, i) => `<span class="pill">${x.h}-${x.a}</span>`).join('')}
        <span class="pill now">${live.finished ? 'FINAL' : 'SET ' + live.setNo}</span>
        <button class="link" data-act="setsToggle">${showSets ? 'Cerrar' : '✎ Corregir'}</button></div>`;
      if (live.finished) h += `<div class="final">PARTIDO TERMINADO</div>`;
      if (showSets) h += setsCard();
    }
    h += `<div class="grid4">${markBtns(true)}</div>
      <div class="grid3">
        ${replayBtn()}
        <button data-act="undo">↶ Deshacer</button>

      </div>`;
    h += panCard();
    const quick = volley ? [['TIEMPO MUERTO', 'tm', 'Tiempo muerto'], ['FIN DE SET', 'set', 'Fin de set']] : [['DESCANSO', 'half', 'Descanso'], ['FIN DEL PARTIDO', 'end', 'Final']];
    h += sec('Pantalla rápida', `<div class="grid3">${quick.map(([v, k, t]) => `<button class="${brkActive() && live.brk.text === v ? 'on' : ''}" data-act="brkq" data-v="${v}" data-k="${k}">${t}</button>`).join('')}
        <button class="${scr ? 'sun' : 'ghost'}" data-act="allHide" ${scr ? '' : 'disabled'}>${backLabel(scr)}</button></div>
        ${volley ? '<p class="muted small" style="margin:0 2px">Tiempo muerto: 30 s con patrocinadores y vuelve solo. Fin de set: hasta "Volver al partido" (máx. 2 min). Al tocar TM de un equipo también sale.</p>' : ''}`,
      scr ? '● ' + esc(scr.text) : 'se ve la cámara');
    if (volley) {
      h += sec('Temporizador', `<div class="card"><div class="tline"><span class="t" id="clk">00:00</span>
          <button class="${live.clock.running ? '' : 'primary'}" data-act="clk">${live.clock.running ? 'Pausar' : 'Iniciar'}</button>
          <span class="small muted">En vídeo</span>${sw(live.timer.show, 'timerToggle')}</div>
          <button class="link" data-act="timerOpen" style="margin-top:4px">${timerOpen ? 'Cerrar ajustes' : 'Ajustar tiempo…'}</button></div>
        ${timerOpen ? timerCard(true) : ''}`);
    } else {
      h += sec('Cronómetro', timerCard(false));
    }
    return h;
  }

  /* ----- Pestaña PANTALLA ----- */

    const presets = live.sport === 'volley'
      ? [['PREPARTIDO', 'pre'], ['TIEMPO MUERTO', 'tm'], ['FIN DE SET', 'set'], ['FIN DE PARTIDO', 'end']]

          <button class="sptile add" data-act="goSponsors">＋ Añadir</button></div>
        <div class="card" style="padding:4px 12px">

          ${opt('Carrusel en las pantallas completas', live.spons.carousel, 'carouselToggle')}
          <div class="optrow"><span>Cambiar cada (segundos)</span><input type="number" min="3" max="120" id="sponsSec" value="${live.spons.sec}" style="width:80px"></div>
        </div>`, 'toca uno para ponerlo a pantalla completa')}
      ${sec('Marcador', `<div class="card" style="padding:4px 12px">
          ${opt('Mostrar marcador', live.board.show, 'boardToggle')}
          <div class="optrow"><span>Posición</span><div class="posgrid">${pos('tl')}${pos('tr')}${pos('bl')}${pos('br')}</div></div></div>`)}
      ${sec('Rótulo inferior', `<div class="card">
          <input id="bannerText" value="${esc(live.banner.text)}" placeholder="Ej: Jornada 5 · Liga Provincial">
          <div class="row" style="margin-top:10px"><button data-act="bannerSave">Guardar texto</button>

  function coverCard() {
    return `<div class="card">

  function ytConnectCard() {
    if (!IS_NATIVE) return `<div class="card"><p class="muted small" style="margin:0">Crear y programar la emisión en YouTube se hace desde el mando de la app del móvil cámara.</p></div>`;

  function resultTable() {
    const volley = live.sport === 'volley';
    const H = live.history;
    const row = side => {
      const t = sideTeam(side);
      const cells = volley ? H.map(x => { const me = side === 'h' ? x.h : x.a, ot = side === 'h' ? x.a : x.h; return `<td class="${me > ot ? '' : 'lo'}">${me}</td>`; }).join('') : '';
      const tot = volley ? live.sets[side] : live.score[side];
      const other = volley ? live.sets[side === 'h' ? 'a' : 'h'] : live.score[side === 'h' ? 'a' : 'h'];
      return `<tr><td class="n"><span class="swc" style="background:${esc(t.color)}"></span>${esc(t.short)}</td>${cells}<td class="${tot > other ? 'win' : 'tot'}">${tot}</td></tr>`;
    };
    return `<table class="restable"><tr><th></th>${volley ? H.map((x, i) => `<th>S${i + 1}</th>`).join('') : ''}<th>${volley ? 'Sets' : 'Goles'}</th></tr>${row('h')}${row('a')}</table>`;
  }

  function highlightsCard() {

  function historyList() {
    const list = Object.entries(matches).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));

      const date = new Date(m.ts).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: '2-digit' });
      const res = m.sport === 'volley' ? `${m.sets.h}-${m.sets.a}` : `${m.score.h}-${m.score.a}`;
      const det = m.sport === 'volley' ? histOf(m).map(x => x.h + '-' + x.a).join(' · ') : '';
      return `<div class="item"><div class="grow"><b>${esc(m.home.short)} ${res} ${esc(m.away.short)}</b><br>

        <button data-act="shareMatch" data-id="${id}">📤</button>
        <button class="danger" data-act="delMatch" data-id="${id}">✕</button></div>`;

  /** Foto del partido actual para guardar o compartir. */
  function matchRecord() {
    const tv = (id, f) => { const t = teamView(id, f); return { id: id || '', name: (teams[id] || {}).name || f, short: t.short, color: t.color }; };
    return { ts: Date.now(), sport: live.sport, home: tv(live.homeId, 'LOCAL'), away: tv(live.awayId, 'VISITANTE'),
             score: live.score, sets: live.sets, history: live.history, finished: live.finished,
             liveStart: (status && status.liveStartTs) || 0,
             marks: Object.values(marks).map(m => ({ ts: m.ts, label: m.label || '', kind: m.kind || '' })) };
  }
  function hasData(L) { return L.score.h || L.score.a || L.sets.h || L.sets.a || L.history.length; }

  function loadImg(src) {
    return new Promise(res => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  }

  /** Genera una imagen cuadrada tipo cartel con el resultado. */
  async function resultImage(m) {
    const S = 1080, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    await (document.fonts && document.fonts.ready);
    g.fillStyle = '#0b1220'; g.fillRect(0, 0, S, S);
    const grad = g.createLinearGradient(0, 0, 0, S); grad.addColorStop(0, 'rgba(198,244,50,.10)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0, 0, S, S);
    const font = (w, px) => `${w} ${px}px 'Barlow Condensed', sans-serif`;
    const text = (t, x, y, px, col, w = 800, align = 'center', maxW) => {
      g.font = font(w, px); g.fillStyle = col; g.textAlign = align; g.textBaseline = 'middle';
      if (maxW) { const mw = g.measureText(t).width; if (mw > maxW) g.font = font(w, px * maxW / mw); }
      g.fillText(t, x, y);
    };
    const volley = m.sport === 'volley';
    text(m.finished || !volley ? 'RESULTADO FINAL' : 'RESULTADO', S / 2, 110, 64, '#c6f432');
    text(new Date(m.ts).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase(), S / 2, 170, 30, '#8c9ab3', 600);
    const logos = await Promise.all([m.home, m.away].map(t => loadImg((teams[t.id] || {}).logo)));
    [[m.home, 230, logos[0]], [m.away, 850, logos[1]]].forEach(([t, x, img]) => {
      const box = 230, top = 250;
      if (img) { const k = Math.min(box / img.width, box / img.height); g.drawImage(img, x - img.width * k / 2, top + (box - img.height * k) / 2, img.width * k, img.height * k); }
      else { g.fillStyle = t.color; g.beginPath(); g.arc(x, top + box / 2, box / 2.4, 0, 7); g.fill(); }
      text(t.name.toUpperCase(), x, top + box + 50, 40, '#eef2f8', 700, 'center', 400);
    });
    const main = volley ? `${m.sets.h} - ${m.sets.a}` : `${m.score.h} - ${m.score.a}`;
    text(main, S / 2, 370, 140, '#ffffff');
    if (volley) text('SETS', S / 2, 270, 32, '#8c9ab3', 700);
    const hist = histOf(m);
    if (volley && hist.length) {
      const colW = 120, top = 680, rowH = 90, n = hist.length;
      const nameW = 260, tW = nameW + n * colW, left = (S - tW) / 2;
      hist.forEach((x, i) => text('SET ' + (i + 1), left + nameW + i * colW + colW / 2, top, 28, '#8c9ab3', 700));
      [[m.home, 'h'], [m.away, 'a']].forEach(([t, sd], r) => {
        const y = top + 40 + r * rowH;
        g.fillStyle = 'rgba(27,38,60,.9)'; g.fillRect(left, y, tW, rowH - 10);
        g.fillStyle = t.color; g.fillRect(left, y, 10, rowH - 10);
        text(t.short, left + 26, y + (rowH - 10) / 2, 40, '#eef2f8', 700, 'left', nameW - 40);
        hist.forEach((x, i) => {
          const mine = sd === 'h' ? x.h : x.a, other = sd === 'h' ? x.a : x.h;
          text(String(mine), left + nameW + i * colW + colW / 2, y + (rowH - 10) / 2, 52, mine > other ? '#ffffff' : 'rgba(255,255,255,.45)');
        });
      });
    }
    text('VoleyCam', S / 2, S - 50, 30, '#26334d', 800);
    return c;
  }

  async function shareRecord(m) {
    const c = await resultImage(m);
    const name = `resultado_${m.home.short}_${m.away.short}.png`.replace(/\s+/g, '_');
    if (IS_NATIVE && window.SportCamNative.shareImage) {
      try { window.SportCamNative.shareImage(c.toDataURL('image/png')); return; } catch (e) {}
    }
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Resultado' }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    toast('Imagen descargada');
  }

  let brkExpiring = 0;
  function tickClock() {
    const el = document.getElementById('clk');
    if (el) el.textContent = SC.fmtClock(SC.clockDisplayMs(live.clock, now()));
    if (live.brk.show && live.brk.until) {
      const left = live.brk.until - now();
      document.querySelectorAll('.brkLeft').forEach(e => e.textContent = '(' + fmtLeft(left) + ')');
      // Caducada: se quita (la cámara ya la había quitado por su cuenta)
      if (left < -1000 && Date.now() - brkExpiring > 5000) { brkExpiring = Date.now(); liveRef.child('brk/show').set(false); }
    }
  }
  setInterval(tickClock, 250);

  /* ---------- Eventos ---------- */
  function val(id) { const e = document.getElementById(id); return e ? e.value : ''; }

  function bind(m) {
    m.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); handle(el.dataset); }));
    const on = (id, ev, fn) => { const e = document.getElementById(id); if (e) e.addEventListener(ev, fn); };
    on('selHome', 'change', e => setField('homeId', e.target.value));
    on('selAway', 'change', e => setField('awayId', e.target.value));
    on('setPts', 'change', e => setField('rules/setPts', Math.max(1, +e.target.value || 25)));
    on('tiePts', 'change', e => setField('rules/tiePts', Math.max(1, +e.target.value || 15)));
    on('durMin', 'change', e => setField('clock/durMs', Math.max(1, +e.target.value || 40) * 60000));
    [['yiWhen', 'when'], ['yiVenue', 'venue'], ['yiComp', 'comp'], ['yiCat', 'cat'], ['yiSeason', 'season']]
      .forEach(([id, k]) => on(id, 'change', e => setField('info/' + k, e.target.value.trim())));
    on('hlBefore', 'change', e => setField('hl/before', Math.min(60, Math.max(2, +e.target.value || 10))));
    [['hlBB', 'bb', 1], ['hlBA', 'ba', 0], ['hlRB', 'rb', 1], ['hlRA', 'ra', 0]].forEach(([id, k, min]) =>
      on(id, 'change', e => setField('hl/' + k, Math.min(60, Math.max(min, +e.target.value || 0)))));
    on('hlName', 'change', e => setField('hl/name', e.target.value.trim() || 'Carmen'));
    on('hlAfter', 'change', e => setField('hl/after', Math.min(30, Math.max(0, +e.target.value || 0))));
    m.querySelectorAll('[data-pan]').forEach(el => {
      el.addEventListener('pointerdown', e => { e.preventDefault(); if (!el.disabled) { try { el.setPointerCapture(e.pointerId); } catch (x) {} panHold(el, el.dataset.pan); } });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, () => panRelease()));
      el.addEventListener('contextmenu', e => e.preventDefault());
    });
    m.querySelectorAll('[data-sq]').forEach(el => el.addEventListener('change', () => {
      const id = el.dataset.sq;
      if (el.checked && squadIds().length >= SQUAD_MAX) { el.checked = false; return toast('Máximo ' + SQUAD_MAX + ' jugadoras'); }
      const num = el.closest('.optrow').querySelector('[data-sqnum]'); if (num) num.disabled = !el.checked;
      squadRef.child('ids/' + id).set(el.checked ? true : null);
    }));
    m.querySelectorAll('[data-sqnum]').forEach(el => el.addEventListener('change', () => {
      const id = el.dataset.sqnum, v = el.value.trim();
      playersRef.child(id + '/nums/' + squadTeamKey()).set(v === '' || +v === +(players[id] || {}).dorsal ? null : +v);
      if (squad.num && squad.num[id] != null) squadRef.child('num/' + id).remove();
    }));
    on('sqTeam', 'change', e => squadRef.child('team').set(e.target.value || null));
    on('sqTag', 'change', e => squadRef.child('tag').set(e.target.value.trim() || null));
    on('shChannel', 'change', e => shareRef.child('channel').set(e.target.value.trim() || DEFAULT_CHANNEL));
    on('shChatMsg', 'change', e => shareRef.child('chatMsg').set(e.target.value.trim()));
    on('sponsSec', 'change', e => setField('spons/sec', Math.min(120, Math.max(3, +e.target.value || 10))));
  }

  async function handle(d) {
    const s = d.s, v = d.v;
    switch (d.act) {
      case 'point': {
        const before = live, next = SC.volleyPoint(live, s);
        act(L => SC.volleyPoint(L, s));
        if (live.hl.auto && next.history.length > before.history.length) {
          const last = next.history[next.history.length - 1];
          marksRef.push({ ts: now(), label: `Fin del set ${next.history.length} · ${last.h}-${last.a}` });
        }
        return;
      }
      case 'goal': return act(L => SC.goal(L, s));
      case 'minus': return act(L => SC.scoreMinus(L, s));
      case 'serve': return act(L => SC.setServe(L, s));
      case 'setAdj': return act(L => SC.adjustSets(L, s, +v));
      case 'setEdit': {
        const i = +d.i, hv = val('sh' + i), av = val('sa' + i);
        if (hv === '' || av === '') return toast('Pon los dos resultados');
        act(L => SC.editSet(L, i, +hv, +av)); return toast('Set ' + (i + 1) + ' corregido');
      }
      case 'setDel':
        if (confirm('¿Borrar el set ' + (+d.i + 1) + '?')) act(L => SC.deleteSet(L, +d.i));
        return;
      case 'setAdd': {
        const hv = val('nsH'), av = val('nsA');
        if (hv === '' || av === '') return toast('Pon los dos resultados');
        return act(L => SC.addSet(L, +hv, +av));
      }
      case 'timerToggle': return setField('timer/show', !live.timer.show);
      case 'undo': return doUndo();
      case 'clk': return act((L, t) => L.clock.running ? SC.clockPause(L, t) : SC.clockStart(L, t));
      case 'clkadj': return act((L, t) => SC.clockAdjust(L, +v, t));
      case 'clkreset': return act(L => SC.clockReset(L));
      case 'period': return setField('clock/period', v);
      case 'dir': return setField('clock/dir', v);
      case 'sport': return setField('sport', v);
      case 'bestOf': return setField('rules/bestOf', +v);
      case 'newMatch':
        if (!confirm('¿Empezar un partido nuevo? El partido actual se guarda en el historial con sus jugadas y el marcador se pone a cero.')) return;
        if (hasData(live) || Object.keys(marks).length) await matchesRef.push(matchRecord());
        act(L => SC.newMatch(L));
        marksRef.remove();
        return toast('Partido guardado en el historial');
      case 'mark': return addMark();
      case 'markc': return addMark(null, 'carmen');
      case 'markb': return addMark(null, 'bloqueo');
      case 'markr': return addMark(null, 'recepcion');
      case 'markKind': editingMark = editingMark === d.id ? null : d.id; return render();
      case 'markTag': {
        const m = marks[d.id]; if (!m) return;
        const tags = tagsOf(m); tags.has(v) ? tags.delete(v) : tags.add(v);
        if (!tags.size) tags.add('jugada');
        return marksRef.child(d.id).update({ kind: kindOf(tags) });
      }
      case 'hlRep': return setField('hl/rep', v);
      case 'hlRq': return setField('hl/rq', v);
      case 'replay': return replayCmd();
      case 'hlSlow': return setField('hl/slow', !live.hl.slow);
      case 'oldHl': try { window.SportCamNative.oldSummaries(); } catch (e) { toast('Actualiza la app'); } return;
      case 'joinRec': try { window.SportCamNative.joinRecordings(); } catch (e) { toast('Actualiza la app'); } return;
      case 'videoHl': try { window.SportCamNative.openVideoHighlights(); } catch (e) { toast('Solo desde la app'); } return;
      case 'spFullPick': {
        const img = await pickImage(1280, true); if (!img) return;
        await sponsRef.child(d.id).update({ full: img }); return toast('Imagen guardada');
      }
      case 'spFullDel': await sponsRef.child(d.id).update({ full: '' }); return toast('Imagen quitada');
      case 'ytPriv': return setField('info/privacy', v);
      case 'ytKids': return setField('info/kids', !live.info.kids);
      case 'ytOld': ytShowOld = !ytShowOld; return render();
      case 'shareOpen': return openShare();
      case 'plNew': editingPl = 'new'; return render();
      case 'plEdit': editingPl = d.id; return render();
      case 'plCancel': editingPl = null; return render();
      case 'plImport': return importPlayers();
      case 'plSave': {
        const nombre = val('plName').trim();
        if (!nombre) return toast('Pon el nombre');
        const data = { dorsal: +val('plNum') || 0, nombre, pos: val('plPos'), cap: !!(document.getElementById('plCap') || {}).checked };
        if (editingPl === 'new') await playersRef.push(data); else await playersRef.child(editingPl).update(data);
        editingPl = null; return render();
      }
      case 'plDel':
        if (!confirm('¿Borrar a ' + ((players[d.id] || {}).nombre || 'esta jugadora') + '?')) return;
        await playersRef.child(d.id).remove(); squadRef.child('ids/' + d.id).remove(); editingPl = null; return render();
      case 'plImg': {
        // Foto: WebP/PNG para conservar la transparencia del recorte; cromo: JPEG
        const img = await pickImage(v === 'cromo' ? 700 : 800, v === 'cromo'); if (!img) return;
        await playersRef.child(d.id).update({ img, imgKind: v === 'cromo' ? 'cromo' : 'foto' });
        return toast(v === 'cromo' ? 'Cromo guardado' : 'Foto guardada');
      }
      case 'sqClear': if (confirm('¿Quitar a todas de la convocatoria?')) squadRef.child('ids').remove(); return;
      case 'panC': return panCmd('pan_c');
      case 'panSpeed': panCmd('pan_v' + v); if (status && status.pan) status.pan.speed = +v; return render();
      case 'panToggle': { const p = panInfo(); panCmd(p && p.on ? 'pan_disable' : 'pan_enable'); return toast(p && p.on ? 'Cabezal desactivado' : 'Activando el cabezal…'); }
      case 'shChat': return shareRef.child('chatOff').set(!share.chatOff);
      case 'coverPick': {
        const img = await pickImage(1280, true); if (!img) return;
        await coverRef.set(img); return toast('Portada guardada');
      }
      case 'coverDel': if (confirm('¿Quitar la portada?')) coverRef.remove(); return;
      case 'ytConnect': try { window.SportCamNative.ytConnect(); } catch (e) {} return;
      case 'ytCreate': {
        if (!live.info.when) return toast('Pon la fecha y hora en la tarjeta de título y descripción');
        const t = ytTexts();
        try { window.SportCamNative.ytCreate(JSON.stringify({ title: t.title, desc: t.desc, when: new Date(live.info.when).toISOString(), privacy: live.info.privacy || 'unlisted', kids: !!live.info.kids })); } catch (e) {}
        return toast('Creando emisión…');
      }
      case 'ytUse': try { window.SportCamNative.ytUse(d.id); } catch (e) {} return;
      case 'ytDesc': try { window.SportCamNative.ytUpdateDesc(d.id, ytTexts().desc); } catch (e) {} return;
      case 'copyTitle': return copyText(ytTexts().title, 'Título copiado');
      case 'copyDesc': return copyText(ytTexts().desc, 'Descripción copiada');
      case 'markDel': return marksRef.child(d.id).remove();
      case 'marksClear': if (confirm('¿Borrar todas las jugadas marcadas?')) marksRef.remove(); return;
      case 'hlAuto': return setField('hl/auto', !live.hl.auto);
      case 'makeHl': try { window.SportCamNative.makeHighlights(); } catch (e) { toast('Solo desde la app'); } return;
      case 'saveMatch':
        if (!hasData(live)) return toast('No hay resultado que guardar');
        await matchesRef.push(matchRecord()); return toast('Guardado en el historial');
      case 'shareCurrent': return shareRecord(matchRecord());
      case 'shareMatch': return matches[d.id] && shareRecord(matches[d.id]);
      case 'delMatch': if (confirm('¿Borrar este partido del historial?')) matchesRef.child(d.id).remove(); return;
      case 'tmCycle': {
        const used = live.to[s];
        act(L => SC.cycleTimeout(L, s));
        if (used < 2) showBreak('TIEMPO MUERTO', 'tm');   // tiempo muerto pedido: pantalla 30 s
        return;
      }
      case 'muteToggle': return setField('muted', !live.muted);
      // Solo una pantalla completa a la vez: al poner una se quita la otra
      case 'brkq':
        if (brkActive() && live.brk.text === v) return liveRef.update({ 'brk/show': false });
        return showBreak(v, d.k || 'custom');
      case 'brkCustom': {
        const t = val('brkText').trim(); if (!t) return toast('Escribe un texto');
        return liveRef.update({ brk: { show: true, text: t.toUpperCase(), kind: 'custom', until: 0 }, 'spFull/show': false });
      }
      case 'brkHide': return setField('brk/show', false);
      case 'allHide': return liveRef.update({ 'brk/show': false, 'spFull/show': false });
      case 'setsToggle': showSets = !showSets; return render();
      case 'timerOpen': timerOpen = !timerOpen; return render();
      case 'expand': return setCompact(false);
      case 'goSponsors': tab = 'ajustes'; spFormOpen = true; render(); { const e = document.getElementById('spAdd'); if (e) e.scrollIntoView({ block: 'center' }); } return;
      case 'channelApp': try { window.SportCamNative.changeChannel(); } catch (e) { toast('Actualiza la app'); } return;
      case 'channelWeb': {
        const k = (prompt('Pega la clave del canal o el enlace del mando:') || '').trim();
        const m = k.match(/[#&?]k=([^&]+)/); const nk = m ? decodeURIComponent(m[1]) : k;
        if (!nk) return; if (nk.length < 16) return toast('Clave no válida');
        try { localStorage.setItem('sc_key', nk); } catch (e) {}
        location.hash = 'k=' + encodeURIComponent(nk); location.reload(); return;
      }
      case 'bannerSave': return setField('banner/text', val('bannerText').trim()), toast('Guardado');
      case 'bannerToggle': {
        const t = document.getElementById('bannerText');
        if (t) setField('banner/text', t.value.trim());
        return setField('banner/show', !live.banner.show);
      }
      case 'sponsToggle': return setField('spons/show', !live.spons.show);
      case 'carouselToggle': return setField('spons/carousel', !live.spons.carousel);
      case 'boardToggle': return setField('board/show', !live.board.show);
      case 'boardPos': return setField('board/pos', v);
      case 'spFull': {
        const show = !(live.spFull.show && live.spFull.id === d.id);
        return liveRef.update({ spFull: { show, id: d.id }, 'brk/show': false });
      }
      case 'spFullHide': return setField('spFull/show', false);
      case 'spDraftLogo': {
        const img = await pickImage(600); if (!img) return;
        spDraft.logo = img; const e = document.getElementById('spDLogo'); if (e) e.style.backgroundImage = `url('${img}')`; return;
      }
      case 'spDraftFull': {
        const img = await pickImage(1280, true); if (!img) return;
        spDraft.full = img; const e = document.getElementById('spDFull'); if (e) { e.style.backgroundImage = `url('${img}')`; e.style.display = ''; } return;
      }
      case 'spDraftFullDel': { spDraft.full = ''; const e = document.getElementById('spDFull'); if (e) e.style.display = 'none'; return; }
      case 'spLogoPick': {
        const img = await pickImage(600); if (!img) return;
        await sponsRef.child(d.id).update({ logo: img }); return toast('Logo cambiado');
      }
      case 'sponsAdd': {
        const name = val('sponsName').trim(), text = val('sponsText').trim(), desc = val('sponsDesc').trim(), link = val('sponsLink').trim();
        if (!spDraft.logo) return toast('Elige el logo para la esquina');
        await sponsRef.push({ name, text, desc, link, logo: spDraft.logo, full: spDraft.full || '' });
        spDraft.logo = ''; spDraft.full = ''; spFormOpen = false; render(); return toast('Patrocinador añadido');
      }
      case 'spEdit': editingSp = d.id; return render();
      case 'spEditCancel': editingSp = null; return render();
      case 'spEditSave': {
        await sponsRef.child(d.id).update({ name: val('esName').trim(), text: val('esText').trim(), desc: val('esDesc').trim(), link: val('esLink').trim() });
        editingSp = null; render(); return toast('Patrocinador guardado');
      }
      case 'sponsDel':
        if (confirm('¿Borrar patrocinador?')) {
          if (live.spFull.id === d.id) setField('spFull/show', false);
          sponsRef.child(d.id).remove();
        }
        return;
      case 'teamNew': editing = 'new'; draftLogo = null; return render();
      case 'loadPreset': {
        const list = (window.SPORTCAM_PRESETS || {})[v] || [];
        toast('Cargando ' + list.length + ' equipos…');
        let n = 0;
        for (const p of list) {
          let logo = '';
          try { logo = await fileToLogo(await (await fetch(p.logo)).blob(), 300); } catch (e) {}
          const data = { name: p.name, short: p.short, color: p.color, logo };
          const found = Object.entries(teams).find(([, t]) => (t.name || '').toLowerCase() === p.name.toLowerCase());
          if (found) await teamsRef.child(found[0]).set(data); else await teamsRef.push(data);
          n++;
        }
        return toast(n + ' equipos cargados');
      }
      case 'teamEdit': editing = d.id; draftLogo = null; return render();
      case 'teamCancel': editing = null; draftLogo = null; return render();
      case 'logoPick': {
        const keep = { name: val('tName'), short: val('tShort'), color: val('tColor') };
        const logo = await pickImage(); if (logo == null) return;
        draftLogo = logo; render();
        document.getElementById('tName').value = keep.name;
        document.getElementById('tShort').value = keep.short;
        document.getElementById('tColor').value = keep.color;
        return;
      }
      case 'logoClear': draftLogo = ''; document.getElementById('logoPrev').style.backgroundImage = ''; return;
      case 'teamSave': {
        const name = val('tName').trim();
        if (!name) return toast('Pon un nombre');
        const short = (val('tShort').trim() || name.slice(0, 14)).toUpperCase();
        const prev = editing === 'new' ? {} : (teams[editing] || {});
        const data = { name, short, color: val('tColor') || '#1e6bff', logo: draftLogo != null ? draftLogo : (prev.logo || '') };
        if (editing === 'new') await teamsRef.push(data); else await teamsRef.child(editing).set(data);
        editing = null; draftLogo = null; render(); return toast('Equipo guardado');
      }
      case 'teamDel':
        if (confirm('¿Borrar este equipo?')) { await teamsRef.child(editing).remove(); editing = null; render(); }
        return;
      case 'copyLink':
        try { await navigator.clipboard.writeText(v); toast('Enlace copiado'); } catch (e) { prompt('Copia el enlace:', v); }
        return;
    }
  }
}
