<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1630">
<title>Marcador en directo · VoleyCam</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:linear-gradient(#0b1630,#070d20);color:#fff;font:500 16px/1.35 Barlow,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 32px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font:800 26px Barlow}.brand span{color:#ffc629}
.state{border-radius:16px;padding:4px 12px;font-weight:800;font-size:13px;background:#e23b3b}
.state.fin{background:#2a3a63}.state.pre{background:#1d5fb4}
.comp{text-align:center;color:#9fb0d6;font-size:14px;margin:10px 0 12px}
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;background:#ffffff0f;border-radius:18px;padding:20px 10px}
.tm{text-align:center;min-width:0}.tm .logo{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 6px;filter:drop-shadow(0 2px 4px #0006)}.tm .c{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;border:3px solid #ffffff33}
.tm .n{font:900 clamp(13px,4.2vw,22px)/1.05 'Barlow Condensed',sans-serif;letter-spacing:.2px;overflow-wrap:break-word}
.pts{font:900 clamp(44px,13vw,84px)/1 'Barlow Condensed',sans-serif;text-align:center;padding:0 8px;white-space:nowrap}.pts span{color:#ffffff55;font-size:56px}
.ph{text-align:center;margin:14px 0 4px;font:900 24px 'Barlow Condensed',sans-serif;letter-spacing:1px;color:#ffc629}
.sets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.s{background:#ffffff12;border-radius:10px;padding:8px 12px;text-align:center;font-weight:700;font-size:13px;color:#c9d4ee}
.s b{display:block;font:900 24px 'Barlow Condensed',sans-serif;color:#fff}.s.cur{outline:2px solid #ffc629}
.ev{margin-top:14px;background:#ffffff0c;border-radius:14px;padding:6px 14px}
.e{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff12}.e:last-child{border:0}
.e .m{width:52px;font:900 20px 'Barlow Condensed',sans-serif;color:#ffc629}.e.x{color:#ffffff88;text-decoration:line-through}
a.yt{display:block;margin-top:16px;background:#ff0033;border-radius:12px;padding:14px;text-align:center;font-weight:800;color:#fff;text-decoration:none}
.foot{text-align:center;color:#6f80a6;font-size:12px;margin-top:12px}
.gate{text-align:center;padding-top:80px;color:#c9d4ee}
.sp{margin-top:16px;background:#fff;border-radius:14px;padding:10px 14px 14px;text-align:center;min-height:0}.sp:empty{display:none}
.sp .spl{color:#5e6e85;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.sp img{width:100%;height:auto;max-height:300px;object-fit:contain;border-radius:8px}
</style>
</head>
<body>
<main id="app"><div class="gate"><div class="brand">Voley<span>Cam</span></div><p style="margin-top:12px">Cargando…</p></div></main>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* Marcador en directo de solo lectura para las familias. El enlace lleva el código del equipo (no la clave del mando).
   Sin nombres de jugadoras. Se actualiza solo. */
(function () {
  const $app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeColor = c => /^#[0-9a-f]{3,8}$/i.test(String(c || '')) ? c : '#556';
  const T = new URLSearchParams(location.hash.slice(1)).get('d') || '';
  const cfg = window.SPORTCAM_FIREBASE || {};
  const gate = msg => { $app.innerHTML = `<div class="gate"><div class="brand">Voley<span>Cam</span></div><p style="margin-top:12px">${msg}</p></div>`; };
  if (!cfg.databaseURL) return gate('Falta la configuración.');
  if (T.length < 16) return gate('Enlace no válido.');
  firebase.initializeApp(cfg);
  const db = firebase.database();
  let offset = 0, data = null;
  const now = () => Date.now() + offset;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  db.ref('pub/' + T).on('value', s => { data = s.val(); render(); }, () => gate('No se pudo conectar.'));
  // Patrocinadores: van pasando solos en la banda de abajo
  let spIdx = 0;
  setInterval(() => { const n = data && Array.isArray(data.spons) ? data.spons.length : 0; if (n > 1) { spIdx = (spIdx + 1) % n; showSpons(); } }, 5000);
  function showSpons() {
    const el = document.getElementById('sp'); if (!el) return;
    const l = (data && data.spons) || []; if (!l.length) { el.innerHTML = ''; return; }
    const src = String(l[spIdx % l.length] || '');
    if (!/^data:image\/|^https:\/\//.test(src)) return;
    el.innerHTML = `<div class="spl">Patrocinan</div><img src="${esc(src)}" alt="">`;
  }
  setInterval(() => { if (data && data.view && data.view.clock && data.view.clock.running) render(); }, 1000);

  function clockText(c) {
    if (!c) return '';
    const e = (c.baseMs || 0) + (c.running && c.startedAt ? Math.max(0, now() - c.startedAt) : 0);
    const ms = c.dir === 'down' ? Math.max(0, (c.durMs || 0) - e) : e;
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function render() {
    if (!data) return gate('Todavía no hay partido. Esta página se actualizará sola cuando empiece.');
    if (data.revoked) return gate('Este marcador en directo no está disponible.');
    if (data.off) return gate('El marcador en directo no está activo ahora mismo.');
    const v = data.view;
    if (!v) return gate('Todavía no hay partido.');
    const football = v.sport === 'football';
    const sc = v.score || {}, st = v.sets || {}, hist = v.history || [];
    const name = t => esc((t && (t.short || t.name)) || '');
    // Escudo del equipo si se ha publicado; si no, un círculo con su color
    const crest = (side, t) => {
      const src = String((data.logos || {})[side] || '');
      return /^data:image\/(png|jpe?g|webp|gif|svg\+xml);base64,/i.test(src) || /^https:\/\//.test(src)
        ? `<img class="logo" src="${esc(src)}" alt="">`
        : `<div class="c" style="background:${safeColor(t && t.color)}"></div>`;
    };
    const state = v.finished ? ['🏁 FINALIZADO', 'fin'] : v.pre ? ['ANTES DE EMPEZAR', 'pre'] : ['🔴 EN JUEGO', ''];
    const inf = v.info || {};
    let phase = '';
    if (v.finished) phase = football ? 'FINAL' : `FINAL · SETS ${st.h || 0}-${st.a || 0}`;
    else if (v.pre) phase = 'ANTES DE EMPEZAR';
    else if (football) phase = `${esc((v.clock && v.clock.period) || '')} · ${clockText(v.clock)}`;
    else phase = `SET ${v.setNo || 1} · SETS ${st.h || 0}-${st.a || 0}`;
    let h = `<div class="top"><div class="brand">Voley<span>Cam</span></div><span class="state ${state[1]}">${state[0]}</span></div>
      <div class="comp">${esc([inf.comp, inf.cat, inf.venue].filter(Boolean).join(' · '))}</div>
      <div class="sb"><div class="tm">${crest('h', v.home)}<div class="n">${name(v.home)}</div></div>
        <div class="pts">${sc.h || 0}<span> - </span>${sc.a || 0}</div>
        <div class="tm">${crest('a', v.away)}<div class="n">${name(v.away)}</div></div></div>
      <div class="ph">${phase}</div>`;
    if (!football && (hist.length || !v.finished)) {
      const items = hist.map((x, i) => `<div class="s">Set ${i + 1}<b>${x.h}-${x.a}</b></div>`);
      if (!v.finished && !v.pre) items.push(`<div class="s cur">Set ${v.setNo || hist.length + 1}<b>${sc.h || 0}-${sc.a || 0}</b></div>`);
      if (items.length) h += `<div class="sets">${items.join('')}</div>`;
    }
    if (football && (v.events || []).length) {
      const side = e => e.equipo === 'L' ? name(v.home) : e.equipo === 'R' ? name(v.away) : '';
      h += `<div class="ev">${v.events.map(e => `<div class="e ${e.anulado ? 'x' : ''}"><span class="m">${e.min != null ? e.min + "'" : ''}</span>
        ${e.tipo === 'gol' ? (e.anulado ? '⚽ Gol anulado' : '⚽ Gol') : '🟨 Tarjeta'}${side(e) ? ' · ' + side(e) : ''}${e.per > 1 ? ` <span style="color:#9fb0d6;font-size:13px">(${e.per}ª parte)</span>` : ''}</div>`).join('')}</div>`;
    }
    if (v.yt && /^[\w-]{6,20}$/.test(v.yt)) h += `<a class="yt" href="https://youtu.be/${v.yt}" target="_blank" rel="noopener">▶ Ver el vídeo en YouTube</a>`;
    else if (!v.finished && v.channel && /^https:\/\/(www\.)?youtube\.com\//.test(v.channel)) h += `<a class="yt" href="${esc(v.channel)}/live" target="_blank" rel="noopener">▶ Ver el directo en YouTube</a>`;
    h += `<div id="sp" class="sp"></div><div class="foot">Se actualiza solo · solo lectura</div>`;
    $app.innerHTML = h;
    showSpons();
  }
})();
</script>
</body>
</html>
